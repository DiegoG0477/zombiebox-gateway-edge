name: Android Edge candidate bundles
on:
  workflow_dispatch:
    inputs:
      version:
        description: Explicit candidate version (vX.Y.Z-dev.N)
        required: true
        type: string
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    strategy:
      max-parallel: 1
      matrix:
        arch: [armv7, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.25.6"
          cache: false
      - run: make deps deps-check check
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sdkmanager 'ndk;28.2.13676358'
      - name: Build Android/Bionic candidate
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
          CANDIDATE_ARCH: ${{ matrix.arch }}
        run: python3 scripts/build-release.py --ndk "$ANDROID_HOME/ndk/28.2.13676358" --version "$CANDIDATE_VERSION" --arch "$CANDIDATE_ARCH" --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: edge-android-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
